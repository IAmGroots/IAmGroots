<svg width="500" height="150" viewBox="0 0 500 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .hello {
      font: bold 28px Arial, sans-serif;
      fill: #58a6ff;
    }

    .starting {
      font: 22px monospace;
      fill: #8b949e;
    }

    .wave {
      transform-origin: 265px 35px;
      animation: wave 1.2s infinite;
      display: inline-block;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(20deg); }
      50% { transform: rotate(-10deg); }
      75% { transform: rotate(20deg); }
    }
  </style>

  <text x="20" y="45" class="hello">
    Hi everyone
  </text>

  <text x="250" y="45" class="hello" class="wave">👋</text>

  <text x="20" y="95" class="starting">
    Starting...
  </text>
</svg>
